name: Release
on:
  pull_request:
  push:
    branches:
      main
    tags:
      - "*"
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref }}"
  cancel-in-progress: true
jobs:
  ctan:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: release.sh
        # We need java, pandoc, and more, which is not provided directly by the image
        uses: dante-ev/latex-action@bdb86d79cf3f01dda7607ff21360695c607a516b # edge
        with:
          entrypoint: ./release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ctan
          path: plantuml.tar.gz
  build_pdflatex:
    # Regression guard for pdfLaTeX support (issue #1). Mirrors build_and_ghpages
    # but compiles the examples with pdflatex instead of lualatex.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set PlantUML version
        id: plantuml-version
        run: echo "version=1.2026.9" >> "$GITHUB_OUTPUT"
      - name: Download PlantUML jar (cached)
        id: plantuml-jar
        uses: ethanjli/cached-download-action@f1d109e4eca8d988e012ed5565366717aba90d0f # v0.1.4
        with:
          url: https://github.com/plantuml/plantuml/releases/download/v${{ steps.plantuml-version.outputs.version }}/plantuml-${{ steps.plantuml-version.outputs.version }}.jar
          destination: /tmp/plantuml/plantuml-${{ steps.plantuml-version.outputs.version }}.jar
          cache-key: plantuml-${{ steps.plantuml-version.outputs.version }}.jar
      - name: Set PLANTUML_JAR
        run: echo "PLANTUML_JAR=${{ steps.plantuml-jar.outputs.destination }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: graphviz inkscape
          version: 1.1
          execute_install_scripts: true
      # cache-apt-pkgs-action restores graphviz from cached .debs without running
      # its post-install "dot -c", leaving the plugin config missing -> dot emits
      # broken output and PlantUML throws UnparsableGraphvizException. Regenerate it.
      - name: Configure graphviz plugins
        run: sudo dot -c
      - name: Install TeX Live
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
           package_file: tl_packages
      - name: example-beamer
        run: pdflatex -shell-escape example-beamer
      - name: example-caption
        # Twice so the cross-references (\ref) resolve.
        run: |
          pdflatex -shell-escape example-caption
          pdflatex -shell-escape example-caption
      - name: example-class-relations--latex
        run: pdflatex -shell-escape example-class-relations--latex
      - name: example-class-relations--svg
        run: pdflatex -shell-escape example-class-relations--svg
      - name: example-class-visibility--latex
        run: pdflatex -shell-escape example-class-visibility--latex
      - name: example-class-visibility--pdf
        run: pdflatex -shell-escape example-class-visibility--pdf
      - name: example-class-visibility--png
        run: pdflatex -shell-escape example-class-visibility--png
      - name: example-class-visibility--svg
        run: pdflatex -shell-escape example-class-visibility--svg
      - name: example-component-diagram
        run: pdflatex -shell-escape example-component-diagram
      - name: example-input-file
        run: pdflatex -shell-escape example-input-file
      - name: example-mindmap
        run: pdflatex -shell-escape example-mindmap
      - name: example-minimal
        run: pdflatex -shell-escape example-minimal.tex
      - name: example-multiple-diagrams-svg
        run: pdflatex -shell-escape example-multiple-diagrams-svg
      - name: example-preamble
        run: pdflatex -shell-escape example-preamble
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pdflatex-pdfs
          path: example-*.pdf
  build_and_ghpages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set PlantUML version
        id: plantuml-version
        run: echo "version=1.2026.9" >> "$GITHUB_OUTPUT"
      - name: Download PlantUML jar (cached)
        id: plantuml-jar
        uses: ethanjli/cached-download-action@f1d109e4eca8d988e012ed5565366717aba90d0f # v0.1.4
        with:
          url: https://github.com/plantuml/plantuml/releases/download/v${{ steps.plantuml-version.outputs.version }}/plantuml-${{ steps.plantuml-version.outputs.version }}.jar
          destination: /tmp/plantuml/plantuml-${{ steps.plantuml-version.outputs.version }}.jar
          cache-key: plantuml-${{ steps.plantuml-version.outputs.version }}.jar
      - name: Set PLANTUML_JAR
        run: echo "PLANTUML_JAR=${{ steps.plantuml-jar.outputs.destination }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: graphviz inkscape
          version: 1.1
          execute_install_scripts: true
      # cache-apt-pkgs-action restores graphviz from cached .debs without running
      # its post-install "dot -c", leaving the plugin config missing -> dot emits
      # broken output and PlantUML throws UnparsableGraphvizException. Regenerate it.
      - name: Configure graphviz plugins
        run: sudo dot -c
      - name: Install TeX Live
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
           package_file: tl_packages
      - name: example-beamer
        run: lualatex -shell-escape example-beamer
      - name: example-caption
        # Twice so the cross-references (\ref) resolve.
        run: |
          lualatex -shell-escape example-caption
          lualatex -shell-escape example-caption
      - name: example-class-relations--latex
        run: lualatex -shell-escape example-class-relations--latex
      - name: example-class-relations--svg
        run: lualatex -shell-escape example-class-relations--svg
      - name: example-class-visibility--latex
        run: lualatex -shell-escape example-class-visibility--latex
      - name: example-class-visibility--pdf
        run: lualatex -shell-escape example-class-visibility--pdf
      - name: example-class-visibility--png
        run: lualatex -shell-escape example-class-visibility--png
      - name: example-class-visibility--svg
        run: lualatex -shell-escape example-class-visibility--svg
      - name: example-component-diagram
        run: lualatex -shell-escape example-component-diagram
      - name: example-input-file
        run: lualatex -shell-escape example-input-file
      - name: example-mindmap
        run: lualatex -shell-escape example-mindmap
      - name: example-minimal
        run: lualatex -shell-escape example-minimal.tex
      - name: example-multiple-diagrams-svg
        run: lualatex -shell-escape example-multiple-diagrams-svg
      - name: example-preamble
        run: lualatex -shell-escape example-preamble
      - name: Gather build artifacts
        run: |
          mkdir build
          mv example-*.pdf build/
          # The committed README preview images are SVG (browsers render them).
          mv example-*.svg build/
          cp -r README.md .github/_config.yml build/
      - name: Publish to GitHub pages
        if: github.ref == 'refs/heads/main'
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: gh-pages
          build_dir: build/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.ref != 'refs/heads/main'
        with:
          name: gh-pages
          path: build/
